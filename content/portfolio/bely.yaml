storyTurningPointFr: |-
  Deux décisions d'architecture ont tout changé sur Bely. Premièrement, nous avons refusé de déléguer le calcul de proximité de la flotte à une API cartographique facturée à la requête : sur des dizaines de véhicules en mouvement continu, la facture cloud explose et la latence dégrade le dispatch. Nous avons écrit le moteur de calcul spatial directement au cœur de PostgreSQL — résultat : moins de 5 millisecondes par recherche, pour un coût marginal nul.

  Deuxièmement, nous avons refusé le modèle « tableau de bord rafraîchi toutes les 30 secondes ». En régie de transport, trente secondes de décalage créent des décisions contradictoires. L'interface de supervision stream les événements en direct sans aucun clignotement, tout en verrouillant hermétiquement les données entre palaces concurrents.
storyTurningPointEn: |-
  Two architectural decisions defined Bely. First, we refused to outsource continuous fleet proximity matching to a pay-per-request external routing API—with dozens of live vehicles, external API bills skyrocket and latency degrades dispatch speed. We built spatial ranking directly inside PostgreSQL, achieving sub-5ms matching at near-zero marginal cost.

  Second, we rejected polling dashboards that refresh every thirty seconds. In live fleet operations, a thirty-second lag causes conflicting assignments. Bely's control tower streams state changes instantaneously with zero visual flicker while enforcing hermetic data isolation between competing luxury hotels.
storyWalkthroughFr: |-
  Il est 19 h 15 à la conciergerie d'un hôtel 5 étoiles. Un client demande un transfert immédiat vers l'aéroport avec attente personnalisée. Le concierge ouvre son portail Bely, saisit la mission en vingt secondes et sélectionne le centre de coûts de la suite.

  En moins de cinq millisecondes, Bely filtre les chauffeurs 100 % conformes réglementairement, identifie la berline la plus proche disponible et pousse la mission géolocalisée. Le concierge voit immédiatement le véhicule approcher sur sa carte en direct, le passager est pris en charge à la seconde près, et la ligne de facturation s'incrémente proprement dans le relevé mensuel de l'hôtel sans aucune intervention humaine.
storyWalkthroughEn: |-
  At 7:15 PM, a five-star hotel concierge receives an urgent VIP airport transfer request. They open their dedicated Bely corporate portal, schedule the ride in twenty seconds, and tag the suite's cost center.

  In under five milliseconds, Bely filters exclusively compliant chauffeurs, selects the nearest available luxury sedan, and dispatches the geofenced mission. The concierge watches the vehicle approach live on map, the passenger steps in right on time, and the ride posts automatically to the hotel's consolidated month-end statement with zero manual accounting.
storyOutcomeFr: |-
  Livré en 35 jours ouvrés, Bely a transformé un métier historiquement manuel en plateforme SaaS B2B scalable. Les opérateurs économisent 40 heures de comptabilité mensuelle, garantissent une flotte 100 % conforme devant les assureurs et les grands comptes, et signent des établissements de luxe qui exigent désormais la traçabilité temps réel comme prérequis contractuel.
storyOutcomeEn: |-
  Shipped in 35 business days, Bely elevated an historically manual operation into a scalable B2B mobility platform. Operators reclaim 40 monthly accounting hours, guarantee 100% fleet regulatory compliance to insurers and enterprise buyers, and win luxury hospitality accounts that now require live traceability in their RFPs.
