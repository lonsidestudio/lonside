storyLeadQuoteFr: "Quand un dirigeant atterrit en jet privé à 22 h 40, le concierge d'un palace n'a pas cinq minutes pour remonter un fil WhatsApp afin de savoir où se trouve le chauffeur."
storyLeadQuoteEn: "When an executive steps off a private flight at 10:40 PM, a five-star concierge does not have five minutes to scroll through WhatsApp threads to locate the chauffeur."
storyOpeningFr: |-
  Dans la mobilité corporate de prestige, la marge d'erreur n'existe pas. Pourtant, derrière les berlines noires et les costumes impeccables, la majorité des opérateurs VTC haut de gamme tournent encore sur un écosystème précaire : des courses attribuées à la voix sur WhatsApp, des fichiers Excel pour vérifier si l'assurance d'un chauffeur expire demain, et quarante heures de pointage manuel chaque fin de mois pour facturer les palaces et directions générales.

  Une seule confusion sur un horaire de vol, un document professionnel expiré lors d'un contrôle ou une facture comportant une erreur de centre de coûts suffit à briser un contrat grands comptes de plusieurs centaines de milliers d'euros. Bely a été conçu pour éliminer définitivement ce risque opérationnel en donnant aux opérateurs de transport privé une tour de contrôle digne de l'aviation d'affaires.
storyOpeningEn: |-
  In executive private mobility, there is zero margin for error. Yet behind the polished sedans and tailored suits, most high-end chauffeur operators still run on fragile workflows: rides dispatched in WhatsApp groups, spreadsheets tracking whether a driver's commercial insurance expires tomorrow, and forty hours of manual billing reconciliation every month-end for luxury hotels and corporate boards.

  One missed flight update, one expired license during a roadside check, or one misallocated corporate invoice can terminate a six-figure enterprise account overnight. Bely was engineered to eliminate that operational fragility permanently, giving private mobility operators an executive control tower worthy of private aviation.
