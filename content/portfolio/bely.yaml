productFaq:
  - questionFr: "Comment Bely garantit-il la conformité légale de toute une flotte VTC ?"
    questionEn: "How does Bely enforce regulatory compliance across an executive fleet?"
    answerFr: "Chaque chauffeur possède un dossier numérique contrôlant les dates d'expiration (carte professionnelle, assurance transport, contrôle technique). Des alertes anticipées partent automatiquement et un véhicule non conforme est écarté du dispatch."
    answerEn: "Every chauffeur profile tracks credential expiration dates (license, insurance, inspections) with proactive alerts and automatic dispatch lockouts if a document expires."
  - questionFr: "Peut-on adapter cette architecture de dispatch à la logistique ou aux interventions terrain ?"
    questionEn: "Can this geospatial dispatch architecture be adapted to field services or logistics?"
    answerFr: "Oui. Le socle de géolocalisation temps réel, de cloisonnement multi-comptes et de facturation consolidée s'applique directement à la livraison urbaine, la maintenance terrain ou la conciergerie."
    answerEn: "Yes. The real-time spatial matching, multi-tenant isolation, and automated B2B billing engine map directly to urban delivery, field service dispatch, and fleet operations."
