storyLeadQuoteFr: "À quatre heures de l'ouverture des portes d'un gala international de 300 invités, deux tables changent : une billetterie statique crée le chaos à l'accueil ; une architecture découplée absorbe le changement en silence."
storyLeadQuoteEn: "Four hours before doors open on a 300-guest international gala, two seating tables shift: static tickets trigger chaos at the door; a decoupled architecture absorbs the change silently."
storyOpeningFr: |-
  Organiser une célébration privée de prestige réunissant des centaines d'invités répartis entre l'Europe, l'Afrique et l'Amérique du Nord est un véritable projet logistique sous haute pression émotionnelle. Les cartons d'invitation papier coûtent plusieurs milliers d'euros et mettent des semaines à franchir les frontières sans garantie de livraison. Pire : sans confirmation fiable par temps fort, le traiteur facture 20 à 30 % de couverts inutiles, tandis que la gestion des entrées VIP et des plans de table de dernière minute vire vite au stress permanent.

  WeedIn est né d'une exigence simple : offrir aux événements privés et galas haut de gamme la fluidité technologique d'une billetterie de grand festival, habillée d'une direction artistique haute couture irréprochable sur smartphone.
storyOpeningEn: |-
  Orchestrating a multi-venue luxury celebration for hundreds of guests traveling across Europe, Africa, and North America is a high-stakes logistical operation. Luxury paper invitations consume thousands of euros and stall in international mail without delivery proof. Worse, unreliable per-ceremony RSVPs cause 20–30% catering waste, while last-minute seating changes and VIP access control create intense day-of friction.

  WeedIn was conceived around one uncompromising standard: deliver the operational speed of modern enterprise event ticketing dressed in haute couture mobile art direction.
