storyTurningPointFr: |-
  Le choix d'architecture qui a sauvé le jour J s'est joué avant même d'écrire la billetterie : nous avons refusé d'imprimer les numéros de table en dur dans l'image du billet PDF. Dans tout événement réel, les tables bougent jusqu'au dernier matin. En découplant l'e-billet graphique (généré en moins de 250 ms avec un QR code cryptographiquement signé) de la base de placement temps réel, les organisateurs ont gardé une liberté totale jusqu'à l'ouverture des portes sans jamais perturber les invités.

  De même, pour la galerie photo collaborative, nous avons refusé de faire transiter les fichiers HD par le serveur applicatif : les smartphones envoient directement leurs clichés vers un stockage cloud chiffré, garantissant zéro saturation pendant la soirée et un score mobile Lighthouse de 94/100 malgré l'ambiance sonore et typographique riche.
storyTurningPointEn: |-
  The architectural decision that saved event day happened before a single ticket was designed: we refused to hardcode table numbers onto static pass artwork. In every real celebration, seating shifts until the final morning. By decoupling personalized visual e-passes (rendered in under 250ms with cryptographically signed QR tokens) from live seating lookups, organizers kept total flexibility until doors opened without ever re-emailing guests.

  Similarly, for the live collaborative photo gallery, we bypassed the application server entirely using direct-to-cloud encrypted uploads—absorbing concurrent smartphone photo spikes effortlessly while maintaining a 94/100 mobile Lighthouse score.
storyWalkthroughFr: |-
  Trois semaines avant l'événement, un invité à New York ouvre son lien privé sur mobile. Il parcourt l'histoire de l'événement, confirme sa présence au dîner de gala et indique son régime alimentaire. Moins d'une seconde plus tard, son e-billet nominatif haute fidélité arrive dans sa boîte mail.

  Le soir du gala, il présente son QR code à l'équipe d'accueil : un scan d'une demi-seconde confirme son identité, l'enregistre présent et affiche immédiatement sa table actualisée. Durant la soirée, il dépose ses photos en haute résolution sur la galerie privée modérée en direct — sans créer de compte ni perdre un pixel de qualité.
storyWalkthroughEn: |-
  Three weeks before the celebration, a guest in New York opens their private link on mobile, explores the multi-venue itinerary, submits their gala RSVP with dietary notes, and receives a bespoke personalized e-pass in under one second.

  On gala night, they flash their QR code at reception: a half-second scan validates authenticity, marks attendance, and surfaces their up-to-the-minute table number. Throughout the evening, they upload full-resolution memories straight into the live moderated gallery—with zero account friction and zero image compression.
storyOutcomeFr: |-
  Livré en 20 jours ouvrés, WeedIn a supprimé les coûts de papeterie internationale, fourni les effectifs exacts au traiteur deux semaines avant l'échéance, fluidifié l'accueil VIP sans la moindre attente et centralisé plus de 600 photographies haute résolution dans un écrin privé pérenne.
storyOutcomeEn: |-
  Delivered in 20 business days, WeedIn eliminated international print overhead, handed exact headcounts to the caterer two weeks ahead of schedule, kept VIP check-in completely queue-free, and preserved over 600 high-resolution guest photographs inside an enduring private showcase.
