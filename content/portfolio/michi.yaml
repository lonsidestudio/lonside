storyLeadQuoteFr: "Une marque e-commerce ne meurt pas par manque de ventes : elle meurt avec 60 000 € de trésorerie bloqués dans ses produits lents pendant que son bestseller est en rupture."
storyLeadQuoteEn: "Fast-growing e-commerce brands rarely die from lack of demand—they suffocate with €60,000 frozen in slow SKUs while their hero bestseller sits out of stock."
storyOpeningFr: |-
  C'est le lundi matin redouté par tout fondateur e-commerce qui passe le cap du million d'euros. Les campagnes d'acquisition performent, les commandes Shopify et Amazon accélèrent… jusqu'au moment où le produit phare qui représente 35 % du chiffre d'affaires tombe à zéro en entrepôt. Le prochain conteneur n'arrive que dans quarante-cinq jours. Pendant ce temps, des dizaines de milliers d'euros dorment sur des références secondaires sur-commandées après un pic promotionnel mal interprété.

  Le coupable est presque toujours le même : un fichier Excel tentaculaire maintenu à la main, basé sur de simples moyennes de ventes passées. Or une moyenne naïve commet deux erreurs fatales : elle confond une rupture de stock avec une baisse de demande, et elle prend un Black Friday éphémère pour une tendance permanente. Michi 道 a été bâti pour remplacer l'intuition et les tableurs cassés par une intelligence d'approvisionnement implacable.
storyOpeningEn: |-
  It is the Monday morning every scaling e-commerce founder dreads. Paid acquisition is humming, Shopify and Amazon orders are accelerating—until the flagship SKU responsible for 35% of revenue hits zero warehouse units, with the next factory shipment forty-five days away. Meanwhile, tens of thousands of euros sit trapped in slow-moving variants over-ordered after a misread promotional spike.

  The culprit is almost always the same: a sprawling, hand-maintained spreadsheet relying on naive trailing sales averages. Simple averages commit two fatal errors: they mistake stockout zeros for falling customer demand, and they treat a one-week Black Friday surge as permanent run-rate. Michi was built to replace guesswork and broken spreadsheets with disciplined, mathematical replenishment intelligence.
