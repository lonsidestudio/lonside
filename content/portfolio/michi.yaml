    afterEn: "Gross-margin ABC matrix focusing capital on top ROI SKUs (-42% stockouts)."
storyTurningPointFr: |-
  Dès le cadrage de Michi 道, nous avons refusé deux pièges classiques des outils Supply Chain. Premier refus : construire une « boîte noire IA » opaque dont les dirigeants financiers refusent de suivre les recommandations parce qu'ils ne peuvent pas vérifier le calcul. Chaque recommandation d'achat dans Michi affiche explicitement la vélocité corrigée, le délai usine, le stock en transit et la marge générée.

  Second refus : laisser les lenteurs d'API externes dicter la vitesse de l'application. Nous avons découplé l'ingestion Shopify/Amazon du cœur de calcul analytique en mémoire. Même avec des dizaines de milliers de lignes de transactions historiques, un directeur des opérations ajuste un délai fournisseur et voit tout son plan de trésorerie se recalculer sous la seconde.
storyTurningPointEn: |-
  From day one on Michi, we rejected two classic Supply Chain software traps. First, we refused to ship an opaque "AI black box" that CFOs distrust because they cannot audit the math. Every purchase recommendation in Michi transparently exposes adjusted velocity, supplier lead time, in-transit stock, and gross margin impact.

  Second, we refused to let slow marketplace APIs dictate dashboard responsiveness. We decoupled Shopify/Amazon ingestion from a high-velocity in-memory analytical engine. Even across tens of thousands of historical transactions, an operations lead can tweak a supplier lead time and watch the entire purchasing and cash plan recompute in under a second.
storyWalkthroughFr: |-
  Lundi 8 h 30, la directrice supply chain ouvre Michi 道. En un coup d'œil, trois alertes critiques remontent en tête : un produit de catégorie A atteint son point de commande dans quatre jours compte tenu des 55 jours de production et de fret maritime.

  Elle clique sur la référence : la courbe affiche les ventes réelles et, en pointillé, la demande reconstituée pendant les douze jours de rupture du trimestre précédent. Elle vérifie que le pic de la vente flash d'automne a bien été neutralisé, valide la quantité optimale proposée au regard de sa trésorerie disponible et exporte son bon de commande fournisseur en moins de deux minutes.
storyWalkthroughEn: |-
  Monday, 8:30 AM: the head of supply chain opens Michi. Three high-priority alerts surface immediately—an A-tier bestseller reaches its reorder trigger in four days given a 55-day manufacturing and ocean freight lead time.

  Clicking the SKU overlays real historical orders against mathematically reconstructed demand from last quarter's twelve-day stockout, confirming that last autumn's flash sale spike was properly filtered out. She verifies working-capital impact against gross margin contribution and exports the supplier purchase order in under two minutes.
storyOutcomeFr: |-
  Déployé en 30 jours ouvrés, Michi 道 a ramené les ruptures de stock de -42 % sur les références clés tout en libérant la trésorerie auparavant gelée dans les surstocks. Les équipes e-commerce ne subissent plus leurs approvisionnements : elles pilotent leur croissance omnicanale avec la rigueur financière d'un grand groupe retail.
storyOutcomeEn: |-
  Deployed in 30 business days, Michi cut hero-SKU stockouts by 42% while unlocking working capital previously trapped in overstocked slow movers. E-commerce teams stop fighting inventory fires and manage omnichannel growth with enterprise-grade financial precision.
