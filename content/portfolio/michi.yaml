slug: michi
client: "Michi 道"
industryFr: "E-commerce & Intelligence Supply Chain"
industryEn: "E-commerce & Supply Chain Intelligence"
headlineFr: "L'outil prédictif qui évite les ruptures de stock sans bloquer de trésorerie."
headlineEn: "Predictive restocking intelligence that prevents stockouts without tying up capital."
challengeFr: "Les marques e-commerce en forte accélération jonglent souvent avec des centaines de références distribuées sur de multiples canaux (Shopify, Amazon, marketplaces). Privées d'outils d'anticipation fiables, elles subissent un double gouffre financier : des ruptures de stock chroniques sur leurs produits vedettes (chiffre d'affaires envolé et pénalités de visibilité) et un surstockage coûteux sur les articles à faible rotation qui immobilise des dizaines de milliers d'euros de trésorerie dans les entrepôts."
challengeEn: "Fast-growing e-commerce brands often juggle hundreds of SKUs across multiple sales channels (Shopify, Amazon, retail marketplaces). Without predictive visibility, they face a severe double penalty: chronic stockouts on hero bestsellers (lost revenue and platform search demotions) and costly overstocking on slow-moving inventory, trapping crucial working capital in stagnant warehouse space."
solutionFr: "Conception et déploiement de Michi 道, une plateforme d'intelligence opérationnelle qui transforme la gestion des approvisionnements en un avantage concurrentiel direct. Connectée en temps réel aux canaux de vente, la solution intègre un moteur d'analyse prédictive capable d'éliminer les biais statistiques (ventes manquées lors des ruptures, anomalies promotionnelles), de calculer automatiquement les dates critiques de réassort en fonction des délais d'usine et de générer des plans d'achat optimisés pour protéger la rentabilité."
solutionEn: "Engineering and delivery of Michi, a supply chain intelligence platform transforming replenishment into a decisive competitive edge. Connected in real time to multi-channel sales streams, the solution features a predictive engine that corrects hidden demand biases during stockouts, normalizes promotional spikes, automatically calculates precise reorder dates based on manufacturing lead times, and generates cash-optimized purchasing plans."
isProprietary: true
studioNoteFr: "Plateforme développée pour résoudre les défis critiques de rupture de stock et de trésorerie des marques e-commerce multi-canaux."
studioNoteEn: "Platform engineered to solve critical stockout and cash-flow challenges for multi-channel e-commerce brands."
clientNeeds:
  - titleFr: "Automatisation et fin des erreurs manuelles sur tableurs"
    titleEn: "Automation and elimination of error-prone manual spreadsheets"
    descFr: "Remplacer des dizaines d'heures hebdomadaires de manipulation fastidieuse de fichiers Excel fragmentés par un tableau de bord centralisé délivrant des recommandations d'achat fiables et instantanées."
    descEn: "Replace dozens of weekly hours spent manipulating fragmented spreadsheets with a centralized, reliable decision dashboard delivering instant purchasing recommendations."
  - titleFr: "Anticipation prédictive des délais fournisseurs (Lead Time)"
    titleEn: "Predictive supplier lead time scheduling (Lead Time & Reorder Point)"
    descFr: "Calculer la date exacte de déclenchement de commande auprès des fabricants (30 à 90 jours de fabrication et d'acheminement) pour garantir une continuité parfaite des ventes sans sur-commander."
    descEn: "Pinpoint the exact reorder trigger date across global manufacturers (30 to 90 days manufacturing and freight) to maintain uninterrupted sales velocity without tying up excess capital."
  - titleFr: "Vision omnicanale unifiée (Shopify, Amazon & Distributeurs)"
    titleEn: "Unified omnichannel visibility (Shopify, Amazon & Retail)"
    descFr: "Fédérer l'ensemble des flux de vente au sein d'un modèle de demande unifié pour piloter les stocks de façon globale plutôt qu'en silos cloisonnés."
    descEn: "Consolidate fragmented sales channels into a unified demand model to orchestrate global inventory rather than managing siloed, disconnected platforms."
  - titleFr: "Priorisation de la trésorerie par la rentabilité (Analyse de marge)"
    titleEn: "Margin-based capital allocation (Profitability ABC Analysis)"
    descFr: "Identifier immédiatement les références qui génèrent 80% de la marge brute pour orienter les budgets d'achat là où le retour sur investissement est maximal."
    descEn: "Instantly distinguish the top tier of products generating 80% of gross margin to allocate purchasing budgets where capital efficiency and ROI are highest."
constraints:
  - badgeFr: "Intelligence Prédictive & Précision"
    badgeEn: "Predictive Intelligence & Accuracy"
    titleFr: "Reconstitution mathématique de la demande réelle masquée par les ruptures"
    titleEn: "Algorithmic reconstruction of true demand masked by stockouts"
    riskFr: "Lorsqu'un produit tombe en rupture, les ventes enregistrées chutent à zéro. Une analyse classique interprète à tort cette baisse comme un désintérêt des clients et recommande de commander moins, provoquant une spirale de ruptures permanentes."
    riskEn: "When a bestseller stocks out, recorded sales drop to zero. A naive model misinterprets this as waning customer interest and recommends ordering fewer units, creating a chronic stockout spiral."
    resolutionFr: "Déploiement d'un modèle d'imputation prédictive qui reconstitue automatiquement la demande manquée lors des périodes de rupture, garantissant des volumes de réapprovisionnement parfaitement ajustés au potentiel réel du marché."
    resolutionEn: "Deployment of a predictive imputation model that mathematically reconstructs lost demand during stockout windows, ensuring future replenishment volumes match true market appetite."
  - badgeFr: "Sécurisation de la Trésorerie"
    badgeEn: "Cash Flow Protection"
    titleFr: "Filtrage des anomalies promotionnelles et protection du besoin en fonds de roulement"
    titleEn: "Promotional spike normalization and working capital protection"
    riskFr: "Les pics de vente éphémères (opérations promotionnelles, buzz sur les réseaux sociaux) risquent de fausser artificiellement les prévisions et de provoquer des commandes massives de stock invendable post-événement."
    riskEn: "Temporary sales surges (flash campaigns, viral spikes) risk artificially inflating run rates, leading to over-purchasing of dead stock after the campaign ends."
    resolutionFr: "Intégration d'un module statistique d'isolation des valeurs aberrantes qui neutralise les effets d'emballement ponctuel, protégeant la trésorerie de l'entreprise des surstocks coûteux."
    resolutionEn: "Integration of an intelligent statistical normalization filter that isolates temporary demand shocks, shielding working capital from costly post-campaign surplus."
  - badgeFr: "Calcul Haute Vélocité"
    badgeEn: "High-Velocity Computation"
    titleFr: "Analyse instantanée de volumes massifs d'historiques transactionnels"
    titleEn: "Instant analysis of massive multi-channel transaction histories"
