productFaq:
  - questionFr: "Pourquoi les tableurs Excel échouent-ils sur la prévision de stocks multi-canaux ?"
    questionEn: "Why do spreadsheets break down for multi-channel inventory forecasting?"
    answerFr: "Un tableur ne corrige ni les ventes manquées pendant les jours de rupture ni les pics promotionnels ponctuels, et multiplie les erreurs de formules dès qu'on croise Shopify, Amazon et des délais fournisseurs variables."
    answerEn: "Spreadsheets fail to adjust for lost sales during stockouts or promotional spikes, and introduce silent formula errors once Shopify, Amazon, and varying factory lead times intersect."
  - questionFr: "Quelle est la vitesse de calcul de Michi 道 sur un catalogue de plusieurs centaines de références ?"
    questionEn: "How fast does Michi recalculate forecasts across hundreds of SKUs?"
    answerFr: "Le moteur analytique découplé recalcule l'ensemble de la chaîne prédictive (imputation, lissage, point de commande et classification ABC) en moins d'une seconde."
