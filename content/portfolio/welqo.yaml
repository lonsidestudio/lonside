storyTurningPointFr: |-
  Lorsque nous avons cadré Welqo au jour 1, la tentation classique aurait été d'empiler quatre SaaS externes reliés par des automatisations fragiles : un CMS vitrine lent, un outil de tarification dynamique facturé au pourcentage du chiffre d'affaires, un prestataire de signature déconnecté et un portail client générique.

  Nous avons délibérément refusé cette architecture en mille-feuille. Un investisseur qui confie un appartement de 400 000 € juge votre rigueur dès la première seconde de chargement sur son smartphone. Nous avons donc unifié l'acquisition (vitrine SEO locale + simulateur de rentabilité), le juridique (mandat eIDAS natif) et l'exploitation (calendrier verrouillé + moteur de yield) dans un socle unique Next.js / PostgreSQL dont Welqo détient 100 % du code source et zéro redevance par nuitée.
storyTurningPointEn: |-
  On Day 1 of scoping Welqo, the easy shortcut would have been stitching together four off-the-shelf SaaS subscriptions with brittle webhooks: a slow marketing theme, a percentage-of-revenue pricing tool, a disconnected signing link, and a generic client portal.

  We deliberately refused that patchwork stack. An investor entrusting a €400,000 property judges your operational rigor in the first two seconds on mobile. Instead, we unified acquisition (local SEO storefront + yield simulator), legal onboarding (native eIDAS signing), and live operations (locked calendar + event yield engine) inside a single Next.js / PostgreSQL platform—100% owned by Welqo, with zero per-night third-party tax.
storyWalkthroughFr: |-
  Un propriétaire cherche sur Google comment rentabiliser son T3 pendant ses déplacements. Il tombe sur la page locale de Welqo (chargée en moins de 120 ms), renseigne la surface et le quartier dans le simulateur, et découvre instantanément son revenu net projeté comparé à un bail classique.

  Quarante-huit heures plus tard, après un échange de quinze minutes, il reçoit un lien privé sur son téléphone : son mandat de gestion personnalisé est prêt. En trois minutes, il paraphe électroniquement sous certification eIDAS, son contrat est horodaté et déposé dans son coffre-fort propriétaire. Dès la mise en ligne du bien, chaque réservation synchronise tous les canaux en temps réel tandis que les nuitées des grands événements s'ajustent automatiquement.
storyWalkthroughEn: |-
  A property owner searches Google for ways to maximize return on a city-center apartment. They land on Welqo's local SEO page (under 120ms response), enter unit size and neighborhood into the yield simulator, and immediately see projected net income versus a standard lease.

  Forty-eight hours later, after a fifteen-minute call, they receive a private link on their phone: their tailored mandate is ready. Within three minutes, they sign under eIDAS certification, the contract is cryptographically timestamped in their encrypted owner vault, and the moment the listing goes live, every channel locks in sync while major event dates automatically command peak yield.
storyOutcomeFr: |-
  En 28 jours ouvrés, Welqo a basculé d'une gestion artisanale plafonnée à une véritable plateforme PropTech propriétaire. Le simulateur de rentabilité transforme désormais le trafic organique local en mandats signés chaque semaine, la synchronisation temps réel a ramené les incidents calendaires à exactement zéro, et l'équipe pilote deux fois plus de biens sans recruter de personnel administratif supplémentaire.
storyOutcomeEn: |-
  Within 28 business days, Welqo graduated from spreadsheet-bound operations to a proprietary PropTech platform. The yield simulator now converts local organic search into signed mandates every week, real-time calendar reconciliation has reduced double-bookings to exactly zero, and the team manages twice the inventory without adding administrative headcount.
