storyTurningPointFr: |-
  Au démarrage du sprint de 14 jours, la solution de facilité aurait été d'installer un thème Shopify standard et d'y greffer huit applications payantes (barre de livraison, upsell, recherche, avis, bandeaux) générant plusieurs centaines d'euros d'abonnements mensuels et des secondes de JavaScript bloquant sur mobile.

  Nous avons pris le parti inverse : coder une couche éditoriale et conversion sur-mesure directement dans le thème (`custom-eunice.css`, utilitaires Tailwind, panier tiroir AJAX et micro-interactions dédiées). Résultat : une identité graphique immédiatement reconnaissable, zéro surcharge applicative inutile, et une maîtrise totale du parcours entre la découverte pédagogique (Méthode CAM & recettes) et le passage en caisse.
storyTurningPointEn: |-
  At the start of the 14-day sprint, the obvious shortcut would have been dropping in a standard Shopify theme and bolting on eight paid apps (shipping bar, upsell popups, search widget, banners)—adding recurring monthly bloat and render-blocking scripts on mobile.

  We took the opposite route: engineering a bespoke editorial and conversion layer directly inside the theme (`custom-eunice.css`, Tailwind utilities, native AJAX cart drawer, and targeted micro-interactions). The result is an unmistakable visual identity, zero unnecessary app bloat, and seamless flow from educational discovery (CAM Method & recipes) straight to checkout.
storyWalkthroughFr: |-
  Une visiteuse arrive sur son smartphone depuis une vidéo sur le rééquilibrage alimentaire afro. Dès le premier écran, la promesse est limpide : réconcilier santé métabolique et plaisir culinaire sans frustration, appuyée par les preuves cliniques d'Eunice KM (diététicienne diplômée d'État, +500 patientes suivies).

  En un geste, elle filtre « L'Apothicairerie Afro-Botanique » sur les tisanes détox, ajoute la tisane ventre plat *UN-BELLY-VABLE* : le tiroir panier glisse sans recharger la page, lui indique exactement le montant restant pour débloquer la livraison offerte en Europe (69 €) et lui propose d'ajouter la poudre de baobab bio en un clic. Si elle préfère un suivi individuel, elle accède directement à la Méthode CAM, aux formules de consultation en visio ou à un échange WhatsApp qualifié.
storyWalkthroughEn: |-
  A visitor arrives on her smartphone from a social video on sustainable Afro-Fusion nutrition. Above the fold, the promise is unmistakable: reconciling metabolic health and culinary joy without guilt, grounded in Eunice KM's state-certified credentials and 500+ patient track record.

  With a single tap, she filters the 'Afro-Botanical Apothecary' to detox infusions and adds *UN-BELLY-VABLE*: the AJAX cart drawer glides open with zero reload, displays the exact amount remaining to unlock €69 European free shipping, and surfaces one-tap organic Baobab powder pairing. And if she wants personalized clinical care, the CAM Method, online video consultations, and direct WhatsApp care sit one tap away.
storyOutcomeFr: |-
  Livré en production en 14 jours ouvrés dans le cadre d'un Sprint Launch au forfait ferme, le nouveau site eunicekm.com dote KM Nutrition d'un outil commercial autonome, rapide et immédiatement crédible à l'échelle européenne. La marque dispose désormais d'une maison digitale évolutive où chaque recette, chaque cure bio et chaque rendez-vous en visio renforce le même écosystème de confiance.
storyOutcomeEn: |-
  Shipped live in 14 business days under a fixed-price Launch Sprint, the new eunicekm.com equips KM Nutrition with a fast, autonomous, European-ready commercial flagship. Every low-GI recipe, organic botanical cure, and video consultation now compounds trust within one cohesive digital brand.
