    resolutionEn: "Built with lean native code (custom Liquid, Tailwind utilities, and focused JS enhancements) eliminating redundant apps, preloading critical stylesheets and fonts, and exposing structured sitemaps for products, collections, recipes, and UCP agentic discovery."
