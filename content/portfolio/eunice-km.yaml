storyLeadQuoteFr: "Quand une praticienne de santé vend aussi des cures botaniques bio, un thème e-commerce générique brise instantanément la confiance clinique — et un site médical figé tue la conversion."
storyLeadQuoteEn: "When a certified clinician also runs an organic botanical brand, a generic store theme instantly erodes medical trust—while a stiff clinic website kills D2C conversion."
storyOpeningFr: |-
  Pour beaucoup de femmes afro-descendantes, les conseils diététiques classiques se résument à une injonction impossible : abandonner le plantain, le manioc et les sauces familiales pour espérer réguler leur glycémie, leur digestion ou un SOPK. En créant la Méthode CAM (Connaissance, Adaptation, Maintien) et une gamme de super-aliments botaniques bio (Moringa, Baobab, infusions ciblées), Eunice KM avait déjà conquis plus de 500 patientes.

  Mais son expérience digitale ne reflétait plus ce niveau d'autorité. Entre les cures physiques expédiées en 24/48h, les e-books téléchargeables, les recettes afro-fusion à index glycémique bas et les consultations diététiques en visio, la marque avait besoin d'un véritable vaisseau amiral D2C capable de convertir sur mobile en quelques secondes tout en inspirant la rigueur d'un cabinet certifié d'État.
storyOpeningEn: |-
  For many Afro-descendant women, mainstream dietetic advice boils down to an unsustainable ultimatum: give up plantain, cassava, and traditional family sauces to manage glycemia, digestion, or PCOS. By founding the CAM Method (Knowledge, Adaptation, Maintenance) alongside a curated line of certified organic botanicals (Moringa, Baobab, targeted infusions), Eunice KM had already earned the trust of over 500 patients.

  Yet the brand's digital footprint needed to match that clinical authority. Spanning physical organic cures shipped in 24–48h, instant-download e-books, low-GI Afro-Fusion recipes, and one-on-one video consultations, KM Nutrition required a bespoke D2C flagship capable of converting mobile visitors effortlessly while radiating state-certified medical credibility.
