slug: eunice-km
client: "Eunice KM"
industryFr: "HealthTech, Diététique Clinique & E-Commerce Bio D2C"
industryEn: "HealthTech, Clinical Nutrition & D2C Organic E-Commerce"
headlineFr: "Écosystème D2C sur-mesure unifiant apothicairerie afro-botanique et cabinet diététique en ligne."
headlineEn: "Custom D2C storefront uniting an organic afro-botanical apothecary and online clinical nutrition practice."
challengeFr: "Diététicienne-nutritionniste diplômée d'État suivie par plus de 500 patientes, Eunice KM (KM Nutrition) devait dépasser les limites d'un simple thème e-commerce générique : comment vendre simultanément des super-aliments et tisanes bio (Moringa, Baobab, cures ciblées) sur 27 marchés européens tout en incarnant la crédibilité médicale d'un cabinet clinique spécialisé dans la Méthode CAM et la cuisine afro-fusion ? Sans architecture éditoriale dédiée ni parcours d'achat fluide, le trafic organique et social se dispersait entre boutique, prise de rendez-vous visio, recettes et messagerie WhatsApp."
challengeEn: "A state-certified dietitian-nutritionist trusted by over 500 patients, Eunice KM (KM Nutrition) outgrew off-the-shelf storefront templates: how do you sell certified organic superfoods and herbal infusions across 27 European markets while projecting the clinical authority of an online nutrition practice built around the CAM Method and Afro-Fusion cuisine? Without custom editorial architecture and a unified buying journey, organic and social traffic fragmented across store pages, video consultations, recipes, and WhatsApp inquiries."
solutionFr: "Conception et ingénierie d'un storefront Shopify entièrement sur-mesure (Liquid, Tailwind CSS, direction artistique éditoriale Fraunces & Inter Tight) fusionnant deux moteurs complémentaires : une apothicairerie D2C haute conversion (panier tiroir AJAX avec jauge de livraison offerte à 69 €, upsells en un clic, filtrage instantané par catégorie, recherche prédictive et multi-devises européen) et un véritable parcours de soin clinique (présentation de la Méthode CAM, formules d'accompagnement en visio, bibliothèque de recettes IG bas et pont direct WhatsApp)."
solutionEn: "Design and engineering of a bespoke Shopify storefront (custom Liquid, Tailwind CSS, Fraunces & Inter Tight editorial art direction) fusing two growth engines: a high-conversion D2C organic apothecary (AJAX cart drawer with a live €69 free-shipping progress bar, one-click recommended upsells, instant category filtering, predictive search, and 27-country EU localization) and a structured clinical nutrition practice (CAM Method showcase, video consultation pathways, low-GI Afro-Fusion recipes, and direct WhatsApp care)."
clientFeedbackFr: "Lonside a transformé KM Nutrition en une véritable maison digitale à la hauteur de notre exigence clinique et botanique. Nos patientes passent naturellement de la découverte de la Méthode CAM à la commande de leurs cures bio ou à la réservation de leur bilan en visio, avec une expérience mobile d'une élégance et d'une fluidité remarquables."
clientFeedbackEn: "Lonside transformed KM Nutrition into a true digital flagship worthy of our clinical and botanical standards. Patients move effortlessly from discovering the CAM Method to ordering their organic cures or booking a video consultation, with remarkable elegance and mobile speed."
