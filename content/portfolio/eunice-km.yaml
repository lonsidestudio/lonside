    badgeEn: "Health & Privacy Compliance"
    titleFr: "Encadrer juridiquement les allégations nutritionnelles et la vente internationale"
    titleEn: "Ensure legal compliance for nutrition disclaimers and international sales"
    riskFr: "La vente de compléments alimentaires et l'accompagnement diététique en ligne sont soumis à des obligations strictes d'information sanitaire, de politique de retours et de protection des données multi-zones."
    riskEn: "Online dietary supplements and nutrition consultations face strict regulatory mandates covering health disclaimers, return policies, and cross-border data privacy."
    resolutionFr: "Déploiement complet de l'architecture légale et sanitaire (avertissement santé dédié, CGV, livraison & retours, politiques RGPD, CCPA, LGPD, PIPEDA et APPI) intégrée nativement dans le parcours client."
    resolutionEn: "Deployed a comprehensive legal and clinical disclosure architecture—dedicated health disclaimer, terms of sale, shipping & returns, plus GDPR, CCPA, LGPD, PIPEDA, and APPI policies—seamlessly integrated into the storefront."
architectureSummaryFr: "L'écosystème Eunice KM repose sur une architecture Shopify sur-mesure pensée pour la performance et la conversion mobile. En remplaçant l'empilement d'applications lourdes par des sections Liquid propriétaires, une couche CSS utilitaire dédiée (Tailwind + custom-eunice.css) et des interactions JavaScript ciblées (panier tiroir AJAX, recherche prédictive, filtres instantanés), la plateforme unifie vente de cures bio physiques, distribution immédiate d'e-books numériques, contenus éditoriaux recettes et prise de rendez-vous clinique sur 27 marchés européens."
architectureSummaryEn: "The Eunice KM ecosystem is engineered on a bespoke Shopify architecture tuned for mobile speed and conversion. By replacing bloated third-party apps with custom Liquid sections, a dedicated Tailwind utility layer (custom-eunice.css), and targeted JavaScript interactions (AJAX cart drawer, predictive search, instant category filtering), the platform unifies physical organic cures, instant digital e-book delivery, Afro-Fusion recipe content, and online clinical bookings across 27 European markets."
