    riskFr: "Sur un trafic majoritairement issu des réseaux sociaux sur smartphone, chaque rechargement de page vers un panier classique ou un popup agressif détruit le taux de conversion et dégrade l'image de sérieux médical."
    riskEn: "With predominantly mobile social traffic, full-page cart redirects or intrusive popups erode conversion rates and undermine clinical credibility."
    resolutionFr: "Ingénierie d'un tiroir panier AJAX natif léger calculant en temps réel le montant restant avant livraison offerte (69 €) et proposant des soins complémentaires (Baobab, Tisane Ventre Plat) ajoutables en un geste sans quitter la page."
    resolutionEn: "Engineered a lightweight native AJAX cart drawer computing the exact remaining threshold for €69 European free shipping in real time and surfacing one-tap complementary products without leaving the current page."
