    resolutionFr: "Création d'un système graphique sur-mesure mêlant typographie serif éditoriale (Fraunces), badges de certification clinique, transparence des avis vérifiés et filtres produits instantanés (Super-aliments, Tisanes & Détox, Guides & E-books)."
    resolutionEn: "Crafted a custom design system blending editorial serif typography (Fraunces), clinical certification badges, verified review transparency, and instant product category filters (Superfoods, Herbal Infusions, E-books)."
