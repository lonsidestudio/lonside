order: 7
questionFr: "Que se passe-t-il si un besoin hors cahier des charges apparaît en cours de sprint — ou si mon projet dépasse un sprint standard ?"
questionEn: "What happens if an out-of-scope request arises mid-sprint—or if my project exceeds a standard sprint?"
answerFr: "Si une nouvelle idée survient pendant le sprint, deux options claires s'offrent à vous sans jamais bloquer le projet : (1) Option recommandée — nous l'ajoutons au backlog post-lancement pour protéger la date de mise en ligne initiale et zéro surcoût ; (2) Avenant Express sous 24 h — si la demande est critique avant le lancement, nous chiffrons en 24 h un mini-avenant fixe (budget et jours ajoutés) validé par écrit avant développement. Pour les projets de grande envergure (plateformes complexes, refontes multi-entités ou appels d'offres), nous réalisons d'abord une Phase 0 de cadrage d'architecture, puis nous déployons le programme en séquences de sprints fermes de 30 jours sur devis."
answerEn: "If a new requirement emerges mid-sprint, two transparent options keep everything moving cleanly: (1) Recommended — we log it into the post-launch backlog so your original launch date and budget remain untouched; (2) 24h Express Addendum — if critical before launch, we issue a fixed-price mini-addendum within 24 hours detailing exact cost and added days, approved in writing before coding begins. For large enterprise systems, multi-entity platforms, or RFPs, we start with a dedicated Phase 0 architecture blueprint and deliver in sequential 30-day fixed-milestone sprints on custom quote."
category: "guarantee"
