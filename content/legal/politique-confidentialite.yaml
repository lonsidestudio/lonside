titleFr: Politique de confidentialité
titleEn: Privacy Policy
sectionsFr:
  - title: Données collectées
    content: "Lonside collecte les données que vous nous transmettez volontairement via le formulaire de contact : nom, email, et message. Ces données sont utilisées exclusivement pour répondre à vos demandes."
  - title: Mesure d’audience
    content: "Avec votre accord, nous utilisons Vercel Web Analytics, PostHog (collecte européenne) et Google Tag Manager / Google Analytics (Consent Mode v2) pour mesurer les visites, les pages consultées et la performance du site de production. Les noms, emails et messages du formulaire ne sont jamais transmis. Les relectures de sessions sont désactivées. Vous pouvez refuser ou retirer votre accord à tout moment dans les préférences de cookies ; les nouveaux envois sont alors immédiatement bloqués."
  - title: Conservation des données
    content: "Vos données sont conservées pour une durée maximale de 3 ans à compter de votre dernière interaction avec nous, conformément à la réglementation RGPD."
  - title: Vos droits
    content: "Conformément au RGPD, vous disposez d'un droit d'accès, de rectification, d'effacement et de portabilité de vos données. Pour exercer ces droits, contactez-nous à hello@lonside.com."
  - title: Cookies
    content: "Les statistiques facultatives Vercel et PostHog sont activées uniquement avec votre accord. PostHog utilise le stockage local et de session du navigateur. Vous pouvez retirer votre accord depuis les préférences de cookies."
sectionsEn:
  - title: Data Collected
    content: "Lonside collects data that you voluntarily transmit via the contact form: name, email, and message. This data is used exclusively to respond to your inquiries."
  - title: Audience measurement
    content: "With your consent, we use Vercel Web Analytics, PostHog (European ingestion), and Google Tag Manager / Google Analytics (Consent Mode v2) to measure visits, pages viewed, and production website performance. Form names, email addresses, and message contents are never transmitted. Session replay is disabled. You can refuse or withdraw consent at any time in cookie preferences; further events are immediately blocked."
  - title: Data Retention
    content: "Your data is stored for a maximum period of 3 years from your last interaction with us, in compliance with GDPR guidelines."
  - title: Your Rights
    content: "Pursuant to GDPR, you have the right to access, rectify, erase, and request portability of your data. To exercise these rights, contact us at hello@lonside.com."
  - title: Cookies
    content: "This site does not use third-party tracking cookies. Only technical cookies strictly necessary for the operation of the website may be used."

