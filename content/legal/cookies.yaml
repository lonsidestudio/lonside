titleFr: Charte d'utilisation des cookies
titleEn: Cookie Policy
buttonLabelFr: Modifier mes préférences de cookies
buttonLabelEn: Modify my cookie settings
sectionsFr:
  - title: Qu'est-ce qu'un cookie ?
    content: Un cookie est un petit fichier texte déposé sur votre terminal (ordinateur, tablette ou mobile) lors de la visite d'un site ou de la consultation d'une publicité. Il a pour but de collecter des informations relatives à votre navigation afin de vous proposer des services personnalisés ou d'analyser l'audience du site.
  - title: Comment gérons-nous votre consentement ?
    content: Lors de votre première visite sur notre site, un bandeau d'information vous informe de la présence de cookies et vous invite à indiquer votre choix. Les cookies ne sont déposés que si vous les acceptez, à l'exception des cookies techniques strictement nécessaires au fonctionnement du site. Vous pouvez modifier vos choix à tout moment en cliquant sur le bouton de configuration ci-dessous.
  - title: Quels types de cookies utilisons-nous ?
    content: |-
      <div class="space-y-4"><p><strong class="text-white">1. Cookies techniques (Essentiels) :</strong> Ces cookies sont indispensables à la navigation sur le site (comme les identifiants de session, le choix de la langue de navigation, ou l'enregistrement de votre consentement pour les cookies). Ils ne peuvent pas être désactivés.</p><p><strong class="text-white">2. Cookies de mesure d'audience (Statistiques) :</strong> Ces outils nous aident à comprendre le parcours des visiteurs et l'utilisation globale du site pour en améliorer la vitesse et l'ergonomie. Nous utilisons Vercel Web Analytics, sans cookies de mesure d’audience, uniquement avec votre accord et sur le site de production. Le refus ou le retrait de votre accord bloque les nouveaux envois.</p><p><strong class="text-white">3. Cookies marketing :</strong> Ces cookies suivent les utilisateurs à travers le web pour afficher des messages pertinents. Nous n'utilisons aucun cookie de ce type à l'heure actuelle.</p></div>
  - title: Liste détaillée des cookies internes déposés
    content: |-
      <div class="overflow-x-auto border border-white/5 rounded-lg"><table class="w-full text-left border-collapse text-[11px] text-slate-400"><thead><tr class="border-b border-white/10 bg-[#0d0d11]"><th class="p-3 text-slate-200 font-bold">Nom</th><th class="p-3 text-slate-200 font-bold">Objectif</th><th class="p-3 text-slate-200 font-bold">Fournisseur</th><th class="p-3 text-slate-200 font-bold">Durée</th></tr></thead><tbody><tr class="border-b border-white/5"><td class="p-3 font-semibold text-brand-purple font-mono">lonside-cookie-consent</td><td class="p-3">Retient les préférences de consentement de cookies de l'utilisateur.</td><td class="p-3 text-slate-300">lonside.ai</td><td class="p-3">Jusqu’à suppression du stockage local</td></tr><tr class="border-b border-white/5"><td class="p-3 font-semibold text-brand-purple font-mono">NEXT_LOCALE</td><td class="p-3">Retient la langue sélectionnée pour la navigation (fr/en).</td><td class="p-3 text-slate-300">lonside.ai</td><td class="p-3">Persistant</td></tr></tbody></table></div>
sectionsEn:
  - title: What is a cookie?
    content: A cookie is a small text file placed on your device (computer, tablet, or mobile) when you visit a website or view an advertisement. Its purpose is to collect information about your browsing habits to provide you with personalized services or to analyze website audience metrics.
  - title: How do we manage your consent?
    content: On your first visit to our site, an information banner notifies you about the presence of cookies and invites you to express your choice. Cookies are only placed if you accept them, with the exception of technical cookies strictly necessary for the site's operation. You can modify your choices at any time by clicking the configuration button below.
  - title: What types of cookies do we use?
    content: |-
      <div class="space-y-4"><p><strong class="text-white">1. Technical cookies (Essential):</strong> These cookies are indispensable for browsing the site (such as session identifiers, browser language choice, or recording your cookie consent preferences). They cannot be deactivated.</p><p><strong class="text-white">2. Audience measurement cookies (Statistics):</strong> These tools help us understand visitor behavior and overall site utilization to improve its speed and usability. We use Vercel Web Analytics without audience measurement cookies, only with your consent and on the production website. Refusing or withdrawing consent blocks further events.</p><p><strong class="text-white">3. Marketing cookies:</strong> These cookies track users across the web to display relevant messages. We do not use any such cookies at this time.</p></div>
  - title: Detailed list of stored internal cookies
    content: |-
      <div class="overflow-x-auto border border-white/5 rounded-lg"><table class="w-full text-left border-collapse text-[11px] text-slate-400"><thead><tr class="border-b border-white/10 bg-[#0d0d11]"><th class="p-3 text-slate-200 font-bold">Name</th><th class="p-3 text-slate-200 font-bold">Objective</th><th class="p-3 text-slate-200 font-bold">Provider</th><th class="p-3 text-slate-200 font-bold">Duration</th></tr></thead><tbody><tr class="border-b border-white/5"><td class="p-3 font-semibold text-brand-purple font-mono">lonside-cookie-consent</td><td class="p-3">Saves the user's cookie consent choices.</td><td class="p-3 text-slate-300">lonside.ai</td><td class="p-3">Until local storage is cleared</td></tr><tr class="border-b border-white/5"><td class="p-3 font-semibold text-brand-purple font-mono">NEXT_LOCALE</td><td class="p-3">Saves the selected navigation language (fr/en).</td><td class="p-3 text-slate-300">lonside.ai</td><td class="p-3">Persistent</td></tr></tbody></table></div>
